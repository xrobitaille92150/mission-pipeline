# Mission Pipeline v3 — ordonnanceur GitHub Actions
#
# Trois déclencheurs :
#   • schedule            : deux runs complets par jour (06:30 et 18:30 heure de Paris en été ; une heure plus tôt en hiver)
#   • repository_dispatch : type « dossier », envoyé par l'automation Airtable quand « Préparer dossier » ou
#                           « Je postule » est coché → run court (sync + dossiers), sans relire Gmail
#   • workflow_dispatch   : lancement manuel depuis l'onglet Actions (run complet ou dossier à la demande par URL)
#
# Secrets du dépôt (Settings → Secrets and variables → Actions → Secrets) :
#   ANTHROPIC_API_KEY, AIRTABLE_PAT, GMAIL_USER, GMAIL_APP_PASSWORD
# Variables facultatives (même écran → Variables) : DIGEST_FROM, DIGEST_TO, MP_MODEL_MAIN, MP_MODEL_FAST,
#   MP_SCORE_MIN, MP_AUTO_DOSSIERS_PER_RUN, MP_INGEST_DAYS

name: mission-pipeline

on:
  schedule:
    - cron: "30 4 * * *"    # 06:30 Paris (CEST) / 05:30 (CET)
    - cron: "30 16 * * *"   # 18:30 Paris (CEST) / 17:30 (CET)
  repository_dispatch:
    types: [dossier]
  workflow_dispatch:
    inputs:
      mode:
        description: "Que lancer ?"
        type: choice
        default: run
        options: [run, dossiers, score, track, doctor]
      url:
        description: "Dossier à la demande : URL LinkedIn (ignore « mode »)"
        type: string
        required: false

concurrency:
  group: mission-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      TZ: Europe/Paris
      PYTHONUNBUFFERED: "1"
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      AIRTABLE_PAT: ${{ secrets.AIRTABLE_PAT }}
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      DIGEST_FROM: ${{ vars.DIGEST_FROM }}
      DIGEST_TO: ${{ vars.DIGEST_TO }}
      MP_MODEL_MAIN: ${{ vars.MP_MODEL_MAIN }}
      MP_MODEL_FAST: ${{ vars.MP_MODEL_FAST }}
      MP_SCORE_MIN: ${{ vars.MP_SCORE_MIN }}
      MP_AUTO_DOSSIERS_PER_RUN: ${{ vars.MP_AUTO_DOSSIERS_PER_RUN }}
      MP_INGEST_DAYS: ${{ vars.MP_INGEST_DAYS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: LibreOffice + polices (conversion DOCX → PDF)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            libreoffice-writer fonts-crosextra-carlito fonts-crosextra-caladea fonts-liberation fonts-dejavu-core
          soffice --version

      - name: Installer mp
        run: pip install -q -e .

      - name: Diagnostic
        run: mp doctor --offline

      - name: Déterminer la commande
        id: cmd
        shell: bash
        run: |
          if [ -n "${{ github.event.inputs.url }}" ]; then
            echo "args=dossier --url ${{ github.event.inputs.url }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "repository_dispatch" ]; then
            echo "args=run --skip ingest score track --label 'à la demande'" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.mode }}" != "run" ]; then
            echo "args=${{ github.event.inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "$(date +%H)" -lt 12 ]; then
            echo "args=run --label matin" >> "$GITHUB_OUTPUT"
          else
            echo "args=run --label soir" >> "$GITHUB_OUTPUT"
          fi

      - name: mp ${{ steps.cmd.outputs.args }}
        shell: bash
        run: eval mp ${{ steps.cmd.outputs.args }}

      - name: Conserver les logs du run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs-${{ github.run_id }}
          path: out/logs/
          retention-days: 14
          if-no-files-found: ignore
